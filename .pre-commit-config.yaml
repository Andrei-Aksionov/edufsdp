repos:
  # Base fixers & file health checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  # Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint-fix
        args:
          - --disable
          - MD013 # line-length
          - MD033 # no-inline-html

  # Local dev tools driven by uv environment
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check --fix
        types: [python]

      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        types: [python]

      - id: ty-check
        name: ty check
        language: system
        entry: uv run ty check
        types: [python]
        pass_filenames: false

      - id: lychee-link-checker
        name: lychee-link-checker
        language: system
        entry: |
          /bin/bash -c '
          mkdir -p /tmp/lychee 2>/dev/null
          SENTINEL_DIR="/tmp/lychee/lychee_lock_${PPID}"
          if ! command -v lychee >/dev/null 2>&1; then
              # mkdir is atomic; only one process will succeed in creating it
              if mkdir "$SENTINEL_DIR" 2>/dev/null; then
                  {
                    echo "--------------------------------------------------------"
                    echo "Warning: Lychee (link checker) not found. Skipping ... "
                    echo ""
                    echo "To enable local link checking, install Lychee:"
                    echo "  - MacOS: brew install lychee"
                    echo "  - Linux/Windows: https://github.com/lycheeverse/lychee"
                    echo "--------------------------------------------------------"
                  } > /dev/tty 2>/dev/null || true
              fi
              exit 0
          fi
          lychee "$@"
          ' --
        args:
          - "--cache"
          - "--quiet"
          - "--no-progress"
          - "--exclude-path=(^|/)\\.[^/]+/"
          - "--root-dir=."
          - "--accept=200,403,429,503"
          - "--exclude=http://localhost:.*"
          - "--exclude=http://127.0.0.1:.*"
          - "--max-retries=5"
          - "--retry-wait-time=10"
          - "--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
        types_or: [markdown, python, jupyter]
