[project]
name = "gloofsdp"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
    "ty>=0.0.88",
]

[tool.pytest.ini_options]
timeout = 30
markers = [
    "multi_rank(world_size=2): run test across multiple CPU processes via torch.multiprocessing.spawn",
]
filterwarnings = ["ignore::FutureWarning"]
