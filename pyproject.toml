[project]
name = "gloofsdp"
version = "0.1.0"
description = """
An educational PyTorch FSDP implementation built for simplicity and \
deep understanding of distributed training mechanics
"""
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Andrei Aksionau" },
]
dependencies = [
    "torch>=2.14.0,<2.15.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0,<4.7.0",
    "pytest>=9.1.1,<9.2.0",
    "pytest-timeout>=2.4.0,<2.5.0",
    "ruff>=0.17.0,<0.18.0",
    "ty>=0.0.88,<0.0.89",
]

[tool.pytest.ini_options]
timeout = 30
markers = ["""
multi_rank(world_size=2): run a test across multiple CPU processes \
via torch.multiprocessing.spawn",
"""]
filterwarnings = ["ignore::FutureWarning", "ignore:Failed to initialize NumPy"]

[tool.ty]
# Silences type errors when overriding base class mutable Callable attributes
# (e.g., PyTorch `nn.Module.forward`).
rules.invalid-mutable-override = "ignore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
